name: Instrumented tests

# Runs the on-device tests on emulators. Heavier than the unit-test gate, so it
# is opt-in (manual + on PRs).
#
# The watch matrix covers both screen shapes: Wear OS layouts differ enough
# between round and square that a test passing on one says little about the
# other. Emulators still cannot cover what this app is actually about - there is
# no GPS fix, no heart-rate sensor and no Bluetooth LE on them - so this gate
# checks structure and navigation, not recording. Recording is verified on a
# physical watch.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wear OS 5 on the largest round screen.
          - name: watch-round
            module: wear
            profile: wearos_large_round
            api-level: 34
            target: android-wear
          # Wear OS 4 on a square screen.
          - name: watch-square
            module: wear
            profile: wearos_square
            api-level: 33
            target: android-wear
          # The phone companion runs a modern API so the notification and
          # foreground-service code paths are actually exercised.
          - name: phone
            module: mobile
            profile: pixel_6
            api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v6
      - name: ${{ matrix.name }} instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: ./gradlew :${{ matrix.module }}:connectedDebugAndroidTest
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-report-${{ matrix.name }}
          path: ${{ matrix.module }}/build/reports/androidTests/connected/
          if-no-files-found: ignore
