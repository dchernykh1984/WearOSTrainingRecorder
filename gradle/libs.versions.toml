# Gradle version catalog: single source of truth for dependency and plugin
# versions. Referenced from the build scripts as `libs.<alias>`.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
junit = "4.13.2"
ktlint-gradle = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
kotlinxSerialization = "1.9.0"
garminFit = "21.176.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# Runtime only - the compiler plugin is deliberately not applied. The race-stats
# payload is a flat map of strings, so parseToJsonElement is enough and the
# module stays free of code generation.
# The official Garmin FIT SDK. Writing FIT with Garmin's own encoder is the only
# way to be sure Garmin Connect accepts the file; a hand-rolled writer would be
# guesswork against a binary format.
garmin-fit = { group = "com.garmin", name = "fit", version.ref = "garminFit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# androidx.test.ext:junit pulls core/monitor/storage but NOT the runner, and the
# runner is what defaultConfig.testInstrumentationRunner names - without it every
# connectedAndroidTest fails to start.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
