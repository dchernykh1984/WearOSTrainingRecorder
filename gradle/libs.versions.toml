# Gradle version catalog: single source of truth for dependency and plugin
# versions. Referenced from the build scripts as `libs.<alias>`.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
junit = "4.13.2"
ktlint-gradle = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
garminFit = "21.176.0"
# Wear Compose 1.6.2 declares androidx.compose 1.9.0, so the compose pin follows
# it rather than the other way round. No BOM: with two Android modules and a
# wear-specific train, explicit versions are easier to reason about than a BOM
# that has to satisfy both.
wearCompose = "1.6.2"
composeUi = "1.9.0"
composeMaterial3 = "1.4.0"
lifecycle = "2.9.4"
activityCompose = "1.12.3"
# 1.19.0 requires compileSdk 37; 1.18.0 is the highest that builds against 36.
coreKtx = "1.18.0"
healthServices = "1.0.0"
wearOngoing = "1.1.0"
wearToolingPreview = "1.0.0"
playServicesWearable = "19.0.0"
datastore = "1.1.7"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
# Runtime only - the compiler plugin is deliberately not applied. The race-stats
# payload is a flat map of strings, so parseToJsonElement is enough and the
# module stays free of code generation.
# The official Garmin FIT SDK. Writing FIT with Garmin's own encoder is the only
# way to be sure Garmin Connect accepts the file; a hand-rolled writer would be
# guesswork against a binary format.
garmin-fit = { group = "com.garmin", name = "fit", version.ref = "garminFit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Health Services returns ListenableFuture; this is the await() bridge.
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
androidx-wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearToolingPreview" }
androidx-wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
androidx-health-services-client = { group = "androidx.health", name = "health-services-client", version.ref = "healthServices" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# androidx.test.ext:junit pulls core/monitor/storage but NOT the runner, and the
# runner is what defaultConfig.testInstrumentationRunner names - without it every
# connectedAndroidTest fails to start.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
